name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # A Nix build takes its version from flake.nix, not the tag, so the
      # two must agree before anything publishes.
      - name: Check the flake version matches the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          got=$(sed -n 's/^ *version = "\(.*\)";$/\1/p' flake.nix)
          if [ "$got" != "$want" ]; then
            echo "flake.nix version is '$got', tag $GITHUB_REF_NAME needs '$want'"
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: false

      # Build snapshot archives first, twice from two fresh clones, and
      # check they are byte-identical (#50) and that each one carries the
      # license files (#40), so neither a broken file list nor an archive
      # that depends on the checkout ever publishes.
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          install-only: true

      - name: Check the archives are reproducible and complete
        run: bash scripts/ci/release-repro.sh

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
