name: release

on:
  push:
    tags:
      - 'v*'

# contents: the release itself. id-token and attestations: the build
# provenance attestations of the archives and checksums.txt (#69).
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # "true" once goreleaser built the release's archives and
    # checksums.txt in this run; the vscode job publishes only then.
    outputs:
      released: ${{ steps.released.outputs.released }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # A Nix build takes its version from flake.nix, not the tag, and
      # the VS Code extension from its package.json (#3), so all three
      # must agree before anything publishes. TestVSCodeManifest keeps
      # package.json and package-lock.json at the flake's version.
      - name: Check the flake and extension versions match the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          got=$(sed -n 's/^ *version = "\(.*\)";$/\1/p' flake.nix)
          if [ "$got" != "$want" ]; then
            echo "flake.nix version is '$got', tag $GITHUB_REF_NAME needs '$want'"
            exit 1
          fi
          got=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' editors/vscode/package.json)
          if [ "$got" != "$want" ]; then
            echo "editors/vscode/package.json version is '$got', tag $GITHUB_REF_NAME needs '$want'"
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: false

      # Build snapshot archives first, twice from two fresh clones, and
      # check they are byte-identical (#50) and that each one carries the
      # license files (#40), so neither a broken file list nor an archive
      # that depends on the checkout ever publishes.
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          install-only: true

      - name: Check the archives are reproducible and complete
        run: bash scripts/ci/release-repro.sh

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the Homebrew cask and the Scoop manifest (#69). When
          # the secret is not set, .goreleaser.yaml skips both uploads.
          PACKAGES_GITHUB_TOKEN: ${{ secrets.PACKAGES_GITHUB_TOKEN }}

      # goreleaser writes checksums.txt once every archive is built and
      # before it publishes. A release that already exists for the tag,
      # such as one created in the GitHub UI, proves nothing about the
      # archives, so the vscode job (#3) waits for this output instead.
      - name: Record that goreleaser built the release
        id: released
        if: ${{ !cancelled() && hashFiles('dist/checksums.txt') != '' }}
        run: echo released=true >>"$GITHUB_OUTPUT"

      # Signed SLSA build provenance for every archive and checksums.txt,
      # verifiable with `gh attestation verify` (docs/install.md).
      # goreleaser publishes the release before it pushes the cask and
      # the Scoop manifest, and a failed push still makes it exit 1, so
      # this step runs whenever goreleaser got as far as checksums.txt;
      # the job still fails on goreleaser's exit status.
      - name: Attest build provenance
        if: ${{ !cancelled() && hashFiles('dist/checksums.txt') != '' }}
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  # The VS Code extension (#3). Its VSIX, built by vsce from the tagged
  # editors/vscode, goes onto the release goreleaser published, then to
  # the VS Code Marketplace with the VSCE_PAT secret and to Open VSX with
  # the OVSX_PAT secret; a store whose secret is not set is skipped.
  # The job runs only when goreleaser built the release's archives and
  # checksums.txt in this run, also when it failed after that (a failed
  # cask push). When goreleaser stopped before them, nothing is
  # published, even if a release for the tag exists.
  vscode:
    needs: goreleaser
    if: ${{ !cancelled() && needs.goreleaser.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the VSIX
        run: |
          want="${GITHUB_REF_NAME#v}"
          got=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' editors/vscode/package.json)
          if [ "$got" != "$want" ]; then
            echo "editors/vscode/package.json version is '$got', tag $GITHUB_REF_NAME needs '$want'"
            exit 1
          fi
          echo "VSIX=gohard-$want.vsix" >>"$GITHUB_ENV"
          nix develop -c bash -c 'cd editors/vscode &&
            npm ci --no-audit --no-fund && npx vsce package'

      - name: Attach the VSIX to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "editors/vscode/$VSIX" \
            --repo "$GITHUB_REPOSITORY"

      - name: Publish to the VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: |
          nix develop -c bash -c 'cd editors/vscode &&
            npx vsce publish --packagePath "$VSIX"'

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: |
          nix develop -c bash -c 'cd editors/vscode &&
            npx ovsx publish "$VSIX"'
