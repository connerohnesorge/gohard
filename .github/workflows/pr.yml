# Pull-request gates (#30). Runs on Linux, macOS and Windows. Every step
# calls a script in scripts/ci/ so the same check runs locally with
# `nix develop -c bash scripts/ci/<name>.sh`. See scripts/ci/README.md
# for which #30 checks are wired now and which later stages add.
name: pr

on:
  pull_request:
  push:
    branches: [main, v1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # Byte-exact fixtures and gofmt need LF files on Windows too.
      - name: Disable line-ending conversion
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
          # The append-only kind-number check (gen-check.d) compares
          # with the merge base of the PR's base branch.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: false
          cache: true

      - name: Build, vet, test (replays testdata/fuzz)
        run: bash scripts/ci/build.sh

      - name: gofmt and golines -m 80
        run: bash scripts/ci/format.sh

      - name: Generated-file sync
        run: bash scripts/ci/gen-check.sh

      - name: CI self-test (gates fail when they should)
        if: runner.os == 'Linux'
        run: bash scripts/ci/selftest.sh

      - name: detlint
        run: bash scripts/ci/detlint.sh

      - name: Parser-regression set (pr)
        run: bash scripts/ci/regression.sh pr

  race:
    name: race (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true

      - name: go test -race
        run: bash scripts/ci/race.sh

  # The headless Neovim end-to-end test (#38) on the oldest supported
  # Neovim (0.10.4, #41) and the current one. The current Neovim comes
  # from the flake's dev shell, the same one used locally; 0.10.4 from
  # a nixpkgs commit pinned by hash (the last before 0.11.0), put ahead
  # of it on PATH. The Helix stdio test, the liveness workload and
  # FuzzLSPReplay run in `check` (go test).
  editors:
    name: neovim ${{ matrix.nvim }} (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - nvim: '0.10.4'
            nixpkgs: 4024d3c5e719281489a894872137b04304cebcac
          - nvim: current
            nixpkgs: ''
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Headless Neovim end-to-end test
        env:
          GOHARD_MEMCAP: '0'
          NIXPKGS_REV: ${{ matrix.nixpkgs }}
        run: |
          if [ -n "$NIXPKGS_REV" ]; then
            nix develop -c nix shell "github:NixOS/nixpkgs/$NIXPKGS_REV#neovim" \
              -c bash scripts/ci/nvim.sh
          else
            nix develop -c bash scripts/ci/nvim.sh
          fi

  # GHDL's ghwdump reads every GHW export (#60). ghwdump comes with
  # GHDL from the flake's dev shell; `check` runs the same test without
  # it and skips the ghwdump part.
  ghwdump:
    name: ghwdump (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: ghwdump on every GHW export
        env:
          GOHARD_MEMCAP: '0'
        run: nix develop -c bash scripts/ci/ghwdump.sh

  install:
    name: go install (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: false
          cache: false

      # Installs the pushed commit by module path from a clean GOPATH,
      # exactly as `go install ...@latest` does after a release.
      - name: go install cmd/gohard@commit and run it
        env:
          GOFLAGS: -mod=mod
          GOPROXY: direct
          GONOSUMDB: github.com/connerohnesorge/gohard
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          export GOPATH="$RUNNER_TEMP/gopath"
          export GOMODCACHE="$GOPATH/pkg/mod"
          cd "$RUNNER_TEMP"
          go install \
            "github.com/connerohnesorge/gohard/cmd/gohard@$SHA"
          "$GOPATH/bin/gohard" version | tee version.txt
          # The pseudo-version names the commit (#39). A tagged commit
          # resolves to its release version, which carries no commit.
          MV=$(go list -m -f '{{.Version}}' \
            "github.com/connerohnesorge/gohard@$SHA")
          if grep -qE '[0-9]{14}-[0-9a-f]{12}$' <<<"$MV"; then
            grep -qx "commit ${SHA:0:12}" version.txt
          else
            grep -qx "version ${MV#v}" version.txt
          fi
