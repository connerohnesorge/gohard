# Release build for gohard (#38). Run by .github/workflows/release.yml on
# v* tags; locally: nix run nixpkgs#goreleaser -- release --snapshot --clean
version: 2

project_name: gohard

builds:
  - id: gohard
    main: ./cmd/gohard
    binary: gohard
    env:
      - CGO_ENABLED=0
      - GOTOOLCHAIN=local
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/connerohnesorge/gohard/internal/cli.Version={{.Version}}
      # `gohard version` and the repro headers show the commit (#39). A
      # release refuses a dirty tree, so there is no -dirty suffix here
      # (and goreleaser reports a snapshot's tree as clean anyway).
      - -X github.com/connerohnesorge/gohard/internal/cli.Commit={{.FullCommit}}
    # Reproducible: file times come from the commit, not the clock.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: gohard
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Reproducible (#50): every archive entry takes its time from the
    # commit and a fixed owner and mode, not the checkout's file times,
    # the runner's user or its umask. scripts/ci/release-repro.sh builds
    # two snapshots from two clones and compares the bytes.
    builds_info:
      owner: root
      group: root
      mode: 0755
      mtime: "{{ .CommitDate }}"
    # scripts/ci/archive-check.sh fails the release when an archive lacks
    # the IEEE license files (#40) or an entry has other file info.
    files:
      - src: README.md
        info: &doc
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: docs/editors.md
        info: *doc
      # The binary embeds the Apache-2.0 IEEE-P1076 packages, so their
      # license and copyright holders ship with it.
      - src: internal/stdlib/LICENSE
        info: *doc
      - src: internal/stdlib/AUTHORS.md
        info: *doc
      # The project license (MPL-2.0) and authors (#38, #40).
      - src: LICENSE
        info: *doc
      - src: AUTHORS.md
        info: *doc

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Package-manager manifests (#69): a Homebrew cask in
# connerohnesorge/homebrew-tap and a Scoop manifest in
# connerohnesorge/scoop-bucket. The release job pushes both with the
# PACKAGES_GITHUB_TOKEN secret (contents write on both repos); without
# it the manifests are still written to dist/ but not uploaded.
homebrew_casks:
  - name: gohard
    ids: [gohard]
    binaries: [gohard]
    directory: Casks
    homepage: https://github.com/connerohnesorge/gohard
    description: VHDL language server, checker, formatter and simulator
    repository:
      owner: connerohnesorge
      name: homebrew-tap
      token: '{{ envOrDefault "PACKAGES_GITHUB_TOKEN" "" }}'
    skip_upload: >-
      {{ if isEnvSet "PACKAGES_GITHUB_TOKEN" }}false{{ else }}true{{ end }}
    commit_msg_template: "gohard: {{ .Tag }}"
    # The binaries are neither signed nor notarized, so macOS would
    # refuse to run one downloaded through Homebrew. This is the hook
    # goreleaser documents for that case: it drops the quarantine
    # attribute from the installed binary.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/gohard"]
          end

scoops:
  - name: gohard
    ids: [gohard]
    homepage: https://github.com/connerohnesorge/gohard
    description: VHDL language server, checker, formatter and simulator
    license: MPL-2.0
    repository:
      owner: connerohnesorge
      name: scoop-bucket
      token: '{{ envOrDefault "PACKAGES_GITHUB_TOKEN" "" }}'
    skip_upload: >-
      {{ if isEnvSet "PACKAGES_GITHUB_TOKEN" }}false{{ else }}true{{ end }}
    commit_msg_template: "gohard: {{ .Tag }}"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: connerohnesorge
    name: gohard
