# The reserved-word table (#31, data from #5 and #6): the single source of
# keywords for every standard. `go generate ./internal/cst` (tools/genkinds)
# turns it into the token kinds Kw<Word> (numbered from 256 in file order,
# append only), the lexer lookup in internal/token/keywords_gen.go and the
# lexer's edge-value test inputs.
#
# Fields:
#   word      the reserved word (lower case)
#   class     vhdl      reserved from `first` on (until `removed`), in VHDL
#                       and PSL code alike
#             psl2008   one of the eleven PSL-only 2008 words: reserved
#                       inside PSL; outside PSL an identifier with a
#                       portability hint (NVC), or reserved everywhere with
#                       psl.strict_keywords: true (GHDL), #11 entry 3
#             psl       PSL-context-only: reserved inside PSL, a plain
#                       identifier outside
#             never     never a keyword in any standard (`inherit`)
#   first     the first standard that reserves the word (VHDL classes) or
#             whose PSL defines it; older standards lex it as an identifier
#   removed   the first standard that no longer reserves it ("" = never)
#   psl       the word has a PSL meaning; a vhdl-class word with psl: true
#             is reserved inside PSL code under every standard, which is
#             how `-- psl` comments work under VHDL-1993
#   suffixes  PSL suffix forms scanned as separate suffix tokens ("!",
#             "_", "!_"); `eventually` requires "!"
#   context   where the word is used (documentation)
#   lcs       the 2019 language change specification (documentation)
#
# Order: 1993 < 2002 < 2008 < 2019; there is no 2000 mode. Each standard
# inherits the previous one; nothing is ever removed.
schema: 1
standards:
  - {name: "1993", inherits: "", add: 97}
  - {name: "2002", inherits: "1993", add: 1}
  - {name: "2008", inherits: "2002", add: 17}
  - {name: "2019", inherits: "2008", add: 2, verified_against_lrm: false}
words:
  - {word: "abs", class: vhdl, first: "1993", psl: false, context: "reserved word"}
  - {word: "access", class: vhdl, first: "1993", psl: false, context: "reserved word"}
