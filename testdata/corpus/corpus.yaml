        'active, 'last_value, 'last_event (TIME'HIGH when no event yet),
        'last_active, 'delayed (one delta), 'delayed(t), 'stable,
        'stable(t), 'quiet, 'quiet(t), 'transaction (3 transactions, one
        without an event), 'driving and 'driving_value (driver changes one
        delta after the assignment), and an edge count using 'event with
        'last_value = '0' (X->1 is not counted). The DUT's
        q_dly <= d'delayed(5 ns) is pinned to exactly 5 ns: '0' at 74 ns,
        '1' at 76 ns with q_dly'last_event = 1 ns, and the same for the
        fall at 85 ns. 'delayed is a transport delay (LRM 16.2.3): a 2 ns
        pulse on d at 90 ns reappears on q_dly at 95-97 ns, and the three
        delta transactions of d at 70 ns all mature at 75 ns where each
        preempts the last, so q_dly has exactly one event at 75 ns (both
        tools agree). Mutated checks are reported by both tools, including
        the DUT delay changed to 0, 1, 3, 4, 4.5, 5.5 and 6 ns and the
        inertial `d after 5 ns` (drops the pulse, reported at 96 ns).
