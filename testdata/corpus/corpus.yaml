      - variant_stable
      - self_stopping
    oracle: nvc
    # GHDL 6.0.0 cannot elaborate this 2019 design, so there is no
    # --disp-tree recording: the hierarchy and generic values are a
    # hand-written golden/hierarchy.txt, reviewed once (#8).
    hierarchy_oracle: "none, hand-checked"
    ghdl:
      version: 6.0.0
      command: >-
        ghdl -a --std=19 prot_cond_pkg.vhd prot_cond.vhd prot_cond_tb.vhd
      result: unsupported
      exit: 1
      stop_time: none
      messages:
        - 'prot_cond_pkg.vhd:20:5:error: unknown tool directive "if" ignored'
        - 'prot_cond_pkg.vhd:48:13:error: missing ";" at end of statement'
      notes: >-
        GHDL 6.0.0 has no conditional analysis, no conditional return
        (return 0 when x < 0), and no std.reflection package (unit
        "reflection" not found in library "std"). It cannot be an oracle for
        this design.
    nvc:
      version: 1.23.0
      command: >-
        nvc --std=2019 -a prot_cond_pkg.vhd prot_cond.vhd prot_cond_tb.vhd
        -e prot_cond_tb -r
      result: pass
      exit: 0
      stop_time: 1 ns
      messages:
        - '** Warning: 1ns+0: prot_cond: counter probe'
        - '** Note: 1ns+0: FINISH called'
      notes: >-
        Every check passes: the protected port counter reads 3, all five
        reflection classes, VHDL_VERSION = "2019", TOOL_NAME = "nvc" equals
        the conditional-analysis branch, GETENV of an unset name is "",
        FILE_LINE > 0, 2**40 and integer'high = 2**63-1, conditional return,
        generic map on a call, inferred length 5, record 'IMAGE "(7,'1')"
        and array 'IMAGE """1010""", GetVhdlAssertCount = 0 before and = 1
        (also GetVhdlAssertCount(WARNING) = 1) after one deliberate
        severity-warning probe. A mutated copy (count = 4) fails with
        "protected port: count /= 3", and deleting the probe fails with
        "assert counter after probe", so the checks are live.
        Protected-type port syntax is
        `variable c : inout counter_t` (`shared` is rejected). NVC 1.23.0
        returns a wrong value from access_value_mirror.get
        (vm.to_access.get.to_integer.value gave a pointer value, not 9), so
        the access check uses is_null instead. The design checks only
        seed- and environment-independent values (no EPOCH/LOCALTIME, no
        FILE_NAME/FILE_PATH, no exact FILE_LINE) so it is variant-stable.
        The TOOL_NAME branch has a "gohard" arm; any other tool gets
        "unknown" and fails the TOOL_NAME check.
    disagreements: []
