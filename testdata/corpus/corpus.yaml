        --std=08 psl_simple_tb --psl-report=<tmp>/psl.json
      result: fail
      exit: 0
      stop_time: 100 ns
      messages:
        - 'psl_simple.vhd:41:3:@35ns:(psl cover note): a then b'
        - >-
          psl_simple.vhd:38:3:@55ns:(psl assertion error): a and b high in
          the same cycle
        - simulation finished @100ns
      notes: >-
        Same events as NVC, but GHDL exits 0 after a PSL assertion error.
        --psl-report lists never_both "failed" (finished-count 1), a_then_b
        "covered" (1) and b_twice "not covered" (0). Nothing is printed for
        the cover miss during the run. GHDL also accepts `default clock` in
        the statement part; the design puts it in the architecture
        declarative part, where NVC requires it.
    nvc:
      version: 1.23.0
      command: >-
        nvc --std=2008 -a psl_simple.vhd psl_simple_tb.vhd -e psl_simple_tb
        -r
      result: fail
      exit: 1
      stop_time: 100 ns
      messages:
        - '** Note: 35ns+0: a then b'
        - '** Error: 55ns+0: a and b high in the same cycle'
        - '** Note: 100ns+0: FINISH called'
      notes: >-
        Native 2008 PSL needs no flag. Do not pass -a --psl: it also parses
        comments starting with "-- psl". NVC prints nothing for the cover
        miss; GoHard reports it as a warning (#35). NVC does not halt on
        the error-severity PSL assert (it does halt on an error-severity
        VHDL assert, see assert_fail), and GHDL halts only at failure, so
        both tools run to the 100 ns finish. GoHard treats PSL and VHDL
        asserts alike and halts at simulation.stop_level (default error,
        #35); this design's gohard.yaml sets stop_level: failure so GoHard
        also runs to 100 ns and matches both tools event for event. Without
        it GoHard would halt at 55 ns.
    disagreements:
      - topic: process exit status after a PSL assertion error
        ghdl: exit 0
        nvc: exit 1
        follows: nvc
        lrm: n/a
        notes: >-
          Tool exit status is outside the LRM; GoHard's rule (#20, #35) is
          that an error-severity PSL assert under --sim exits 1. Reported
          events and times agree.
