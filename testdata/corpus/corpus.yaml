# GoHard oracle corpus manifest (issue #8).
#
# Schema and field meanings: testdata/corpus/README.md.
# The builder fragments (<name>/entry.yaml, regression.entry.yaml) were
# merged here in S2a and removed; this file is the only source of truth.
#
# `trace_sha256`, `oracle_sha256`, `format_oracle_sha256` and
# `semerr_sha256` are written by `go run ./tools/oracle --update`, which
# rewrites only changed hashes. Until the #36 canonical trace format and
# its oracle sections exist, `trace_sha256` and `oracle_sha256` hold the
# literal value `pending`; `format_oracle_sha256` (#32) and
# `semerr_sha256` (#34, in each design and in the ghdl and nvc
# regression entries) are always recorded.

schema: 1

# Fixed vocabularies. A design's `features` and `invariants` may only use
# the ids listed here. The feature list is exactly the semantics list in
# the "Done when" section of #8; every id must appear in the `features` of
# at least one design.
vocabulary:
  features:
    - id: delta_ordering
      semantic: delta ordering
    - id: multi_driver_resolution
      semantic: multi-driver std_logic resolution
    - id: postponed_processes
      semantic: postponed processes
    - id: wait_forms
      semantic: every wait form
    - id: delay_mechanisms
      semantic: inertial/transport/reject delays
    - id: signal_attributes
      semantic: signal attributes ('event, 'last_value, 'delayed)
    - id: process_all
      semantic: process(all)
    - id: force_release
      semantic: force/release
    - id: external_names
      semantic: external names
    - id: std_env
      semantic: std.env
    - id: textio
      semantic: textio
    - id: mode_views_converse
      semantic: mode views and 'converse
    - id: cond_analysis_builtin_id
      semantic: conditional analysis, built-in identifier (in mode_views)
    - id: cond_analysis_user_define
      semantic: >-
        conditional analysis, user identifier from defines: (in mode_views)
    - id: cond_analysis_inactive_branch
      semantic: conditional analysis, inactive branch (in mode_views)
    - id: protected_type_ports
      semantic: protected-type ports
    - id: psl_assert_cover
      semantic: PSL assert and cover
    - id: generate_hierarchy
      semantic: generate hierarchy
    - id: overload_resolution
      semantic: overload resolution
    - id: standin_models
      semantic: stand-in models
  invariants:
    - id: seed_independent
      meaning: byte-identical trace at seeds 0-3 (PR) and 64 seeds (nightly)
    - id: variant_stable
      meaning: outcome unchanged under layout, case, rename and
        independent-statement reordering variants
    - id: self_stopping
      meaning: stops on its own (std.env.stop/finish or end of events)
    - id: fails_by_design
      meaning: fails on purpose with the recorded messages (assert_fail)
    - id: hits_budget
      meaning: never terminates; ends in sim/budget-exceeded (budget_hang)
    - id: standard_gated
      meaning: valid only under its tagged standard; analysis under a
        later standard is expected to fail (vhdl93_only)
    - id: modeled_drivers_marked
      meaning: every value driven by a simulation.models stand-in is
        marked modeled in the trace
    - id: unsupported_before_milestone
      meaning: before its milestone, exits 2 with unsupported/construct
        "planned for v1.1" naming each construct used

designs:
  - name: assert_fail
    standard: "2008"
    milestone: v1.0
    files:
      - path: assert_fail.vhd
        standard: "2008"
      - path: assert_fail_tb.vhd
        standard: "2008"
    top: assert_fail
    testbench: assert_fail_tb
    defines: {}
    models: {}
    expected:
      exit: 1
      status: problems
      stop_time: 30 ns
      messages:
        - severity: hint
          text: "assert_fail: starting checks"
          time: 10 ns
        - severity: warning
          text: "assert_fail: sum wrapped to 2"
          time: 20 ns
        - severity: error
          text: "assert_fail: expected 12, got 11"
          time: 30 ns
    features: []
    invariants: [seed_independent, variant_stable, fails_by_design]
    oracle: both
    hierarchy_oracle: ghdl
    ghdl:
      version: 6.0.0
      command: >-
        ghdl -a --std=08 assert_fail.vhd assert_fail_tb.vhd;
        ghdl --elab-run --std=08 assert_fail_tb --assert-level=error
      result: fail
      exit: 1
      stop_time: 30 ns
      messages:
        - "assert_fail_tb.vhd:32:5:@10ns:(report note): assert_fail: starting checks"
        - "assert_fail_tb.vhd:37:5:@20ns:(assertion warning): assert_fail: sum wrapped to 2"
        - "assert_fail_tb.vhd:43:5:@30ns:(assertion error): assert_fail: expected 12, got 11"
        - "ghdl:error: assertion failed"
        - "ghdl:error: simulation failed"
      notes: >-
        --assert-level=error is needed to stop and fail on the error
        assertion; without it GHDL prints the same three lines, reaches the
        end of events at 30 ns and exits 0 (its default assert level is
        failure). Severities map per #20/#35: report note -> hint, assertion
        warning -> warning, assertion error -> error and exit 1. The halt at
        30 ns comes from the default simulation.stop_level (error); nothing
        is scheduled after 30 ns, so the stop time is the same either way.
    nvc:
      version: 1.23.0
      command: >-
        nvc --std=2008 -a assert_fail.vhd assert_fail_tb.vhd
        -e assert_fail_tb -r
      result: fail
      exit: 1
      stop_time: 30 ns
      messages:
        - "** Note: 10ns+0: assert_fail: starting checks"
        - "** Warning: 20ns+0: assert_fail: sum wrapped to 2"
        - "** Error: 30ns+0: assert_fail: expected 12, got 11"
      notes: >-
        NVC's default --exit-severity is error, so it stops and exits 1 at
        the error assertion with no extra option.
        The warning and error texts are built from the observed sum
        (integer'image(to_integer(s))), so "wrapped to 2" and "got 11" pin
        the DUT's a + b; mutating the DUT to a - b or a or b gives "got 15"
        or "got 7" under both tools.
    disagreements:
      - topic: >-
          default halt severity and exit code for a severity-error
          assertion
        ghdl: continues and exits 0 unless --assert-level=error is given
        nvc: stops at the error assertion and exits 1 by default
        follows: nvc
        lrm: "10.3"
        notes: >-
          The LRM leaves halting on an assertion implementation defined.
          GoHard's default simulation.stop_level (error) and #20's exit 1 for
          severity error match NVC's default; the recorded GHDL command adds
          --assert-level=error so both tools give the same outcome.
    trace_sha256: pending
    oracle_sha256: pending
    format_oracle_sha256: 94f4f084426baf39982f1199a3a23095a90d765a82ba68fd130a51b51e9c4704
    semerr_sha256: d4df6cca09a6319134abeaead1e3422770b7bb5bdda0cf25b9d73d51b258b0f5
  - name: budget_hang
    standard: "2008"
    milestone: v1.0
    files:
      - path: budget_hang.vhd
        standard: "2008"
      - path: budget_hang_tb.vhd
        standard: "2008"
    top: budget_hang
    testbench: budget_hang_tb
    defines: {}
    models: {}
    expected:
      exit: 1
      status: problems
      stop_time: 1 ms
      messages:
        - severity: error
          code: sim/budget-exceeded
          text: time_budget
          time: 1 ms
    features: []
    invariants: [seed_independent, variant_stable, hits_budget]
    oracle: both
    hierarchy_oracle: ghdl
    ghdl:
      version: 6.0.0
      command: >-
        ghdl -a --std=08 budget_hang.vhd budget_hang_tb.vhd;
        ghdl --elab-run --std=08 budget_hang_tb --stop-time=1ms
      result: bounded
      exit: 0
      stop_time: 1 ms
      messages:
        - "ghdl:info: simulation stopped by --stop-time @1ms"
      notes: >-
        Still running when --stop-time ends it; also checked with
        --stop-time=10ms (stopped by --stop-time @10ms, exit 0). The clock
        toggles every 5 ns forever and nothing calls std.env.stop/finish.
        GoHard ends the run with the default simulation.time_budget (1 ms),
        reported as sim/budget-exceeded (error under check --sim, exit 1,
        #20/#35). Expected message text is provisional until #20's table
        fixes the wording; it must name the exhausted budget.
    nvc:
      version: 1.23.0
      command: >-
        nvc --std=2008 -a budget_hang.vhd budget_hang_tb.vhd
        -e budget_hang_tb -r --stop-time=1ms
      result: bounded
      exit: 0
      stop_time: 1 ms
      messages: []
      notes: >-
        Stops silently at --stop-time with exit 0; also checked with
        --stop-time=10ms (exit 0, about 0.4 s of run time).
    disagreements: []
    trace_sha256: pending
    oracle_sha256: pending
    format_oracle_sha256: fc46b6ac8d47033e318591de4c4f503ada8e77b7a4e8e2e214ee25f25b5de7e3
    semerr_sha256: 6d3e3a22800cf15a4d2824b4fe8c452a074222dacc4a4f2e420def2eb23ccfda
  - name: force_ext
    standard: "2008"
    milestone: v1.0
    files:
      - path: force_ext.vhd
        standard: "2008"
      - path: force_ext_tb.vhd
        standard: "2008"
    top: force_ext
    testbench: force_ext_tb
    defines: {}
    models: {}
    expected:
      exit: 0
      status: clean
      stop_time: 9 ns
      messages: []
    features: [process_all, force_release, external_names]
    invariants: [seed_independent, variant_stable, self_stopping]
    oracle: both
    hierarchy_oracle: ghdl
    ghdl:
      version: 6.0.0
      command: >-
        ghdl -a --std=08 force_ext.vhd force_ext_tb.vhd;
        ghdl --elab-run --std=08 force_ext_tb
      result: pass
      exit: 0
      stop_time: 9 ns
      messages:
        - "simulation finished @9ns"
      notes: >-
        Finished via std.env.finish at 9 ns with no assertion output.
        process(all): comb reacts to a, b and op; pick reacts to sel and to
        mid (replacing pick's (all) with (mid) fails the sel check).
        External names: absolute <<signal .force_ext_tb.dut.mid>>,
        upward-relative <<signal ^.dut.mid>> from a process in block chk,
        relative <<signal dut.mid>> from the testbench architecture
        (checked against the expected mid at 1 .. 8 ns; mid has no
        testbench counterpart, so aliasing a and b instead is reported),
        and
        <<constant .force_ext_tb.dut.C_MAGIC>> = 42; all aliases sit in
        process declarative parts after the dut instance so the objects are
        elaborated first. force: mid <= force "0110" (default mode for a
        non-port signal) overrides comb and holds while the inputs change;
        release returns mid to its current driving value without a new
        transaction. Dropping the force or the release is reported.
    nvc:
      version: 1.23.0
      command: >-
        nvc --std=2008 -a force_ext.vhd force_ext_tb.vhd
        -e force_ext_tb -r
      result: pass
      exit: 0
      stop_time: 9 ns
      messages:
        - "** Note: 9ns+0: FINISH called"
      notes: >-
        Same outcome as GHDL. NVC prints a note for FINISH; it is not a
        design message.
    disagreements: []
    trace_sha256: pending
    oracle_sha256: pending
    format_oracle_sha256: 7c16ae3aba230fb4e90c6b22d3bb804c3e88d0cbed8b6081bce316e7b6bff792
    semerr_sha256: e7de4cbd17dab071e18844d9ceaa585c7d119a2f68891d7b8d376f56e37c8c79
  - name: hier_generate
    standard: "2008"
    milestone: v1.0
    files:
      - path: hier_generate_lane.vhd
        standard: "2008"
      - path: hier_generate.vhd
        standard: "2008"
      - path: hier_generate_tb.vhd
        standard: "2008"
    top: hier_generate
    testbench: hier_generate_tb
    defines: {}
    models: {}
    expected:
      exit: 0
      status: clean
      stop_time: 50 ns
      messages: []
    features: [generate_hierarchy, std_env]
    invariants: [seed_independent, variant_stable, self_stopping]
    oracle: both
    hierarchy_oracle: ghdl
    ghdl:
      version: 6.0.0
      command: >-
        ghdl -a --std=08 hier_generate_lane.vhd hier_generate.vhd
        hier_generate_tb.vhd;
        ghdl --elab-run --std=08 hier_generate_tb
      result: pass
      exit: 0
      stop_time: 50 ns
      messages:
        - "simulation finished @50ns"
      notes: >-
        N = 4, BASE = 2: lanes(0..3).u have W = 2, 3, 4, 5 on a 14-bit
        bus; odd lanes take polarity.inv, even lanes polarity.pass; the
        outer tap if-generate takes multi. --disp-tree=inst shows
        dut/rtl/lanes(0)..lanes(3) [for-generate] each with u [instance]
        -> hier_generate_lane/rtl/polarity [if-generate true], then
        tap [if-generate true]. GHDL's tree prints the if-generate but not
        the alternative label (inv/pass, multi); GoHard's hierarchy names
        the alternative. Five stimuli, the last with odd parity, so the
        multi branch (xor din = '1') differs from single ('0'): forcing
        the single branch (multi : N > 100) is reported at 50 ns as
        "parity mismatch". Finished via std.env.finish at 50 ns.
    nvc:
      version: 1.23.0
      command: >-
        nvc --std=2008 -a hier_generate_lane.vhd hier_generate.vhd
        hier_generate_tb.vhd -e hier_generate_tb -r
      result: pass
      exit: 0
      stop_time: 50 ns
      messages:
        - "** Note: 50ns+0: FINISH called"
      notes: same outcome as GHDL
    disagreements: []
    variants:
      - name: width_err
        standard: "2008"
        files:
          - path: hier_generate_lane.vhd
            standard: "2008"
          - path: hier_generate_width_err.vhd
            standard: "2008"
          - path: hier_generate_tb.vhd
            standard: "2008"
        expected:
          exit: 1
          status: problems
          stop_time: none
          messages:
            - severity: error
              text: hier_generate_tb.dut.lanes(2).u
            - severity: error
              text: hier_generate_tb.dut.lanes(2).u
        ghdl:
          version: 6.0.0
          command: >-
            ghdl -a --std=08 hier_generate_lane.vhd
            hier_generate_width_err.vhd hier_generate_tb.vhd;
            ghdl --elab-run --std=08 hier_generate_tb
          result: elab-error
          exit: 1
          stop_time: none
          messages:
            - "hier_generate_width_err.vhd:31:22:error: mismatching vector length; got 3, expect 4"
            - "hier_generate_width_err.vhd:31:47:error: mismatching vector length; got 3, expect 4"
          notes: >-
            Analysis passes (exit 0); elaboration reports both port
            associations (a and y) of the one bad instance, by source
            position only, without the instance path.
        nvc:
          version: 1.23.0
          command: >-
            nvc --std=2008 -a hier_generate_lane.vhd
            hier_generate_width_err.vhd hier_generate_tb.vhd;
            nvc --std=2008 -e hier_generate_tb -r
          result: elab-error
          exit: 2
          stop_time: none
          messages:
            - "** Fatal: (init): actual length 3 does not match formal length 4"
          notes: >-
            Analysis passes (exit 0). Elaboration reports the first
            association (a) at line 31 "while elaborating instance U", then
            crashes with SIGSEGV in jit_interp (an NVC 1.23.0 bug), hence
            exit 2. Only the first error is reported.
        disagreements:
          - topic: errors reported for the bad instance
            ghdl: both associations (a at 31:22, y at 31:47), exit 1
            nvc: first association only, then a crash, exit 2
            follows: ghdl
            lrm: "14.3.5"
            notes: >-
              Each association whose actual length differs from the formal
              is an error (LRM 14.3.5 port map elaboration, 6.5.7.3
              matching elements). GoHard reports both, each naming the
              elaborated instance path hier_generate_tb.dut.lanes(2).u
              (#35), and never reports lanes 0, 1 or 3.
        notes: >-
          hier_generate_width_err.vhd is analyzed in place of
          hier_generate.vhd. It is identical except that lane 2 is wired
          through a slice one bit narrower than its W = 4 port, so exactly
          one generate instance is wrong. Message text is provisional until
          #20's table fixes the wording; it must name the instance path.
          Both messages point at hier_generate_width_err.vhd:31 (columns 22
          and 47).
    trace_sha256: pending
    oracle_sha256: pending
    format_oracle_sha256: 5f66f04782a786dc41c8bc14e422030fc76a501c7170f83dcedd5333ccf7cf07
    semerr_sha256: 1ebb9668c01cfb682480300524dca8c74b3e07814194e8d94f2d71e855d58a42
  - name: md_resolve
    standard: "2008"
    milestone: v1.0
    files:
      - path: md_resolve.vhd
        standard: "2008"
      - path: md_resolve_tb.vhd
        standard: "2008"
    top: md_resolve
    testbench: md_resolve_tb
    defines: {}
    models: {}
    expected:
      exit: 0
      status: clean
      stop_time: 99 ns
      messages: []
    features: [delta_ordering, multi_driver_resolution]
    invariants: [seed_independent, variant_stable, self_stopping]
    oracle: both
    hierarchy_oracle: ghdl
    ghdl:
      version: 6.0.0
      command: >-
        ghdl -a --std=08 md_resolve.vhd md_resolve_tb.vhd;
        ghdl --elab-run --std=08 md_resolve_tb
      result: pass
      exit: 0
      stop_time: 99 ns
      messages:
        - "simulation finished @99ns"
      notes: >-
        Finished via std.env.finish at 99 ns with no assertion output. The
        testbench checks all 81 pairs of the 9 std_ulogic values
        (U X 0 1 Z W L H -) on two DUT drivers of the inout port bus_io
        against an independent copy of the IEEE 1164 table, then three
        drivers across the port
        boundary (L,H,Z=W; L,H,1=1; 0,H,1=X), all-Z, element-wise vector
        resolution ("01HZ" with "1L0Z" = "X10Z"), the chain d0->d3 settling
        one delta per stage (d3 changes at 97 ns delta 4; ports add no
        delta), and a two-signal swap in one delta. A mutated check (d3 at
        delta 3, a wrong swap result, a wrong X row in the expected table)
        is reported by both tools. Caution for
        tools/oracle: GHDL exits 0 after severity-error assertions when the
        run ends in std.env.finish, so a pass is judged by the absence of
        assertion messages, not by the exit code.
    nvc:
      version: 1.23.0
      command: >-
        nvc --std=2008 -a md_resolve.vhd md_resolve_tb.vhd
        -e md_resolve_tb -r
      result: pass
      exit: 0
      stop_time: 99 ns
      messages:
        - "** Note: 99ns+0: FINISH called"
      notes: >-
        Same outcome as GHDL. NVC prints a note for FINISH; it is not a
        design message. Unlike GHDL, NVC exits 1 when a severity-error
        assertion fired earlier in the run.
    disagreements: []
    trace_sha256: pending
    oracle_sha256: pending
    format_oracle_sha256: f440d6de675b9a0bbb49ee160573acdde6f381afa5a0c005ed3bd5472cb1e51a
    semerr_sha256: 7cb0e70a4265cf1b768b3efdeedf728e8b19ac2505777bdebab064f3fdaa8f7d
  - name: mode_views
    standard: "2019"
    milestone: v1.0
    files:
      - path: mode_views_pkg.vhd
        standard: "2019"
      - path: mode_views.vhd
        standard: "2019"
      - path: mode_views_tb.vhd
        standard: "2019"
    top: mode_views
    testbench: mode_views_tb
    # MV_PROFILE reaches GoHard through the design-local gohard.yaml
    # `defines:` (#31); this field mirrors it and must stay equal.
    config: gohard.yaml
    defines:
      MV_PROFILE: wide
    models: {}
    expected:
      exit: 0
      status: clean
      stop_time: 165 ns
      messages: []
    features:
      - mode_views_converse
      - cond_analysis_builtin_id
      - cond_analysis_user_define
      - cond_analysis_inactive_branch
    invariants: [seed_independent, variant_stable, self_stopping]
    oracle: nvc
    # GHDL 6.0.0 cannot elaborate this 2019 design, so there is no
    # --disp-tree recording: the hierarchy and generic values are a
    # hand-written golden/hierarchy.txt, reviewed once (#8).
    hierarchy_oracle: "none, hand-checked"
    ghdl:
      version: 6.0.0
      command: >-
        ghdl -a --std=19 mode_views_pkg.vhd mode_views.vhd mode_views_tb.vhd
      result: unsupported
      exit: 1
      stop_time: none
      messages:
        - 'mode_views_pkg.vhd:26:5:error: unknown tool directive "if" ignored'
      notes: >-
        GHDL 6.0.0 has no conditional analysis: every `if/`elsif/`else/`end
        and `error directive is "unknown tool directive ... ignored" (an
        error), and it has no option to define a user identifier (no -D).
        With the directives stripped by hand to their active branches (in a
        /tmp copy, not committed) GHDL analyzes the mode view, the
        'converse alias and both view-typed ports and runs to "simulation
        finished @165ns", exit 0, so GHDL agrees with NVC on everything but
        conditional analysis. Because GHDL cannot elaborate the real files,
        there is no --disp-tree recording: the expected hierarchy
        (mode_views_tb, dut, dut.u_prod, dut.u_cons) is hand-written in S5.
    nvc:
      version: 1.23.0
      command: >-
        nvc --std=2019 -a -D MV_PROFILE=wide mode_views_pkg.vhd mode_views.vhd
        mode_views_tb.vhd -e mode_views_tb -r
      result: pass
      exit: 0
      stop_time: 165 ns
      messages:
        - '** Note: 165ns+1: FINISH called'
      notes: >-
        Full pass: four handshakes through the view port and its converse,
        sum 10, finish at 165 ns + 1 delta. Checked the directives are live:
        with -D MV_PROFILE=narrow the run fails at 0 ms with "MV_PROFILE
        branch not taken" (exit 1); with no -D, analysis fails with
        "undefined conditional analysis identifier MV_PROFILE" and the
        `error text "MV_PROFILE must be wide or narrow"; under --std=2008
        `view` is rejected ("VIEW is a reserved word in VHDL-2019").
    disagreements:
      - topic: conditional analysis tool directives
        ghdl: rejects `if/`elsif/`else/`end as unknown tool directives
        nvc: implements them, with -D NAME=VALUE for user identifiers
        follows: nvc
        lrm: "24.2"
        notes: >-
          IEEE 1076-2019 conditional analysis tool directives (section
          number not verified against the LRM text). GHDL 6.0.0 lacks the
          feature, so it is not a semantic disagreement about the design.
    trace_sha256: pending
    oracle_sha256: pending
    format_oracle_sha256: e634b69fd6b07941074a6155b26020f7aa012363fc00d3b4deb73a2581f608c8
    semerr_sha256: 1eae310d6f7aef6f91a429c3c22b7551a0fe593f5a75c3390f36e6590d1f2cec
  - name: overload_ops
