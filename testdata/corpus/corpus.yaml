      result: fail
      exit: 1
      stop_time: 65 ns
      messages:
        - '** Note: 35ns+0: req then ack'
        - '** Error: 65ns+0: ack did not follow req'
      notes: >-
        --exit-severity=error makes NVC treat the PSL assertion error as
        fatal ("this will be treated as a fatal error") and stop at
        65 ns; psl_simple, recorded without it, runs on. Same events and
        times as GHDL and GoHard.
    disagreements:
      - topic: the time step of the halt in the VCD dump (trace oracle)
        ghdl: dumps nothing of the 65 ns step in which the assert fails
        nvc: dumps the rising clk edge of the 65 ns step
        follows: ghdl
        lrm: n/a
        notes: >-
          Dump content is outside the LRM. GoHard's trace has the 65 ns
          clk edge, as NVC's dump does; the trace section compares a run
          the design ended without its final time step, as GHDL dumps
          one, so clk is compared with GHDL only.
