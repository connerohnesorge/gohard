      notes: >-
        Finished via std.env.finish at 8 ns with no assertion output.
        y_port is <<signal .force_out_tb.dut.y : std_logic>>, an out
        port. `force out '0'` at 1 ns sets y and the value the dut reads
        back (y_seen) to '0' and holds while a changes; `release out`
        returns both to not a; `force 'Z'` without a mode (out, the
        default for a port of mode out, LRM 10.5.2.1) and `release` do
        the same. Dropping the force out, the release out or the default
        force is reported by NVC and GoHard ("force out at the actual",
        "released out", "default force mode"). Replacing the out mode by
        in changes nothing in either tool, so the design does not tell
        the two modes apart at a port of mode out.
