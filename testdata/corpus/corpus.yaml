  - name: postponed_attrs
    standard: "2008"
    milestone: v1.0
    files:
      - path: postponed_attrs.vhd
        standard: "2008"
      - path: postponed_attrs_tb.vhd
        standard: "2008"
    top: postponed_attrs
    testbench: postponed_attrs_tb
    defines: {}
    models: {}
    expected:
      exit: 0
      status: clean
      stop_time: 98 ns
      # #35: a zero-width glitch is a warning. The delta glitch of g to
      # '0' at 20 ns is deliberate (the postponed assert must not see it).
      messages:
        - severity: warning
          code: sim/glitch
          text: "zero-width glitch on postponed_attrs_tb.g at 20 ns"
    features: [postponed_processes, signal_attributes]
    invariants: [seed_independent, variant_stable, self_stopping]
    oracle: both
    hierarchy_oracle: ghdl
    ghdl:
      version: 6.0.0
      command: >-
        ghdl -a --std=08 postponed_attrs.vhd postponed_attrs_tb.vhd;
        ghdl --elab-run --std=08 postponed_attrs_tb
      result: pass
      exit: 0
      stop_time: 98 ns
      messages:
        - "simulation finished @98ns"
      notes: >-
        Finished via std.env.finish at 98 ns with no assertion output.
        Postponed: at 70 ns d glitches through three deltas; the ordinary
        process(d) runs 3 times, the postponed process once, seeing only
        the settled '1' (runs counted with the initial run: 2 at 71 ns,
        3 at 81 ns); a postponed concurrent assertion never sees the delta
        glitch of g at 20 ns, which an ordinary process does see. Removing
        "postponed" makes both checks fail. Attributes checked: 'event,
        'active, 'last_value, 'last_event (TIME'HIGH when no event yet),
        'last_active, 'delayed (one delta), 'delayed(t), 'stable,
        'stable(t), 'quiet, 'quiet(t), 'transaction (3 transactions, one
        without an event), 'driving and 'driving_value (driver changes one
        delta after the assignment), and an edge count using 'event with
        'last_value = '0' (X->1 is not counted). The DUT's
        q_dly <= d'delayed(5 ns) is pinned to exactly 5 ns: '0' at 74 ns,
        '1' at 76 ns with q_dly'last_event = 1 ns, and the same for the
        fall at 85 ns. 'delayed is a transport delay (LRM 16.2.3): a 2 ns
        pulse on d at 90 ns reappears on q_dly at 95-97 ns, and the three
        delta transactions of d at 70 ns all mature at 75 ns where each
        preempts the last, so q_dly has exactly one event at 75 ns (both
        tools agree). Mutated checks are reported by both tools, including
        the DUT delay changed to 0, 1, 3, 4, 4.5, 5.5 and 6 ns and the
        inertial `d after 5 ns` (drops the pulse, reported at 96 ns).
    nvc:
      version: 1.23.0
      command: >-
        nvc --std=2008 -a postponed_attrs.vhd postponed_attrs_tb.vhd
        -e postponed_attrs_tb -r
      result: pass
      exit: 0
      stop_time: 98 ns
      messages:
        - "** Note: 98ns+0: FINISH called"
      notes: >-
        Same outcome as GHDL, including S'STABLE being false and S'DELAYED
        still old in the delta of the event. NVC prints a note for FINISH;
        it is not a design message.
    disagreements:
      - topic: initial value of d'delayed(5 ns) (trace oracle)
        ghdl: >-
          q_dly settles on '0' at 0 fs: the concurrent assignment runs at
          initialisation and reads d'delayed(5 ns), whose initial value is
          d's initial value '0'
        nvc: >-
          q_dly stays 'U' until 5 ns, as if d'delayed(5 ns) started at
          the default value of std_logic
        follows: ghdl
        lrm: 16.2.3
        notes: >-
          The implicit signal S'DELAYED(T) takes the initial value of S.
          The trace section compares q_dly with the GHDL recording only.
        signals:
          - postponed_attrs_tb.dut.q_dly
          - postponed_attrs_tb.q_dly
