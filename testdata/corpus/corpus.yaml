  - name: case_generate
    standard: "2008"
    milestone: v1.1
    files:
      - path: case_generate.vhd
        standard: "2008"
      - path: case_generate_tb.vhd
        standard: "2008"
    top: case_generate
    testbench: case_generate_tb
    defines: {}
    models: {}
    expected:
      exit: 0
      status: clean
      stop_time: 40 ns
      messages: []
    features: [case_generate]
    invariants: [seed_independent, variant_stable, self_stopping]
    oracle: both
    hierarchy_oracle: ghdl
    ghdl:
      version: 6.0.0
      command: >-
        ghdl -a --std=08 case_generate.vhd case_generate_tb.vhd;
        ghdl --elab-run --std=08 case_generate_tb
      result: pass
      exit: 0
      stop_time: 40 ns
      messages:
        - "simulation finished @40ns"
      notes: >-
        Four instances, OP = 0, 2, 4 and 9, take the alternatives op_and
        (choice 0), op_or (choice list 1 | 2), op_xor (range 3 to 5, with
        its own signal t) and op_not (others); four stimuli are checked
        against each function. --disp-tree=inst shows u0 .. u9 [instance]
        -> case_generate/rtl/pick [case-generate] without the alternative
        label, which GoHard's hierarchy names. Finished via std.env.finish
        at 40 ns. Instantiating OP => 6 instead of 4 (op_not instead of
        op_xor) is reported at 10 ns as "OP 4: xor" by GHDL, NVC and
        GoHard.
    nvc:
      version: 1.23.0
      command: >-
        nvc --std=2008 -a case_generate.vhd case_generate_tb.vhd
        -e case_generate_tb -r
      result: pass
      exit: 0
      stop_time: 40 ns
      messages:
        - "** Note: 40ns+0: FINISH called"
      notes: same outcome as GHDL
    disagreements:
      - topic: VCD scope of the signal declared in a case generate
          alternative (trace oracle)
        ghdl: does not dump t of u4's op_xor alternative
        nvc: >-
          dumps it as case_generate_tb.u4.op_xor.t, under the
          alternative label without the generate label pick
        follows: ghdl
        lrm: n/a
        notes: >-
          Dump scopes are outside the LRM. GoHard's trace names the
          signal case_generate_tb.u4.pick.op_xor.t (the generate label,
          then the alternative label, as its hierarchy does), so t is
          compared with no tool; y4, which t drives, is compared with
          both.
        signals:
          - case_generate_tb.u4.op_xor.t
    trace_sha256: 4fe5a59c3de81b41c5c720d68259c8dc7971d20c261a94bc164c3ef0d5cfc86f
    oracle_sha256: 9ac19414687d438d3151f0a8a52eccefb758f2fc1fba7edd368983661d191137
    format_oracle_sha256: 9e8eac29ece7f5cec639083899493f366de2324ec33304416eba30ef4a1c69cd
    semerr_sha256: 80bb1678b17655891dc8263f30d5d50a2f1e228b2bc47ebbe4c2afe00336faf6
  - name: delayed_attrs
    standard: "2008"
    milestone: v1.1
    files:
      - path: delayed_attrs_tb.vhd
        standard: "2008"
    top: delayed_attrs_tb
    testbench: delayed_attrs_tb
    defines: {}
    models: {}
    expected:
      exit: 0
      status: clean
      stop_time: 50 ns
      messages: []
    features: [delayed_vector_resolved, signal_attributes]
    invariants: [seed_independent, variant_stable, self_stopping]
    oracle: both
    hierarchy_oracle: ghdl
    ghdl:
      version: 6.0.0
      command: >-
        ghdl -a --std=08 delayed_attrs_tb.vhd;
        ghdl --elab-run --std=08 delayed_attrs_tb
      result: pass
      exit: 0
      stop_time: 50 ns
      messages:
        - "simulation finished @50ns"
      notes: >-
        v_dly <= v'delayed(5 ns) on a 4-bit std_logic_vector and r_dly <=
        r'delayed(5 ns) on a std_logic driven by drv_a and drv_b. Checked
        between events: v_dly is "1010" at 16 ns, "1011" at 18 ns (one
        element moved at 17 ns, v_dly'last_event = 1 ns, element 0 of
        v'delayed(5 ns) is '1'), "0000" at 20 ns, "1000" at 25.5 ns (the
        1 ns pulse on element 3 at 20 ns comes through), "0000" at 27 ns;
        r_dly is 'Z' at 12 ns, '1' at 16 ns, 'X' at 27 ns (both drivers
        on since 20 ns), '0' at 37 ns, 'Z' at 47 ns. Finished via
        std.env.finish at 50 ns. Mutations reported by GHDL, NVC and
        GoHard alike: v'delayed(4 ns) ("v delayed event at 17 ns" at
        18 ns), r'delayed(6 ns) ("r delayed at 16 ns") and the inertial
        `v after 5 ns`, which drops "1010" ("v delayed at 16 ns").
    nvc:
      version: 1.23.0
      command: >-
        nvc --std=2008 -a delayed_attrs_tb.vhd -e delayed_attrs_tb -r
      result: pass
      exit: 0
      stop_time: 50 ns
      messages:
        - "** Note: 50ns+0: FINISH called"
      notes: same outcome as GHDL
    disagreements:
      - topic: initial values of v'delayed(5 ns) and r'delayed(5 ns)
          (trace oracle)
        ghdl: >-
          v_dly and r_dly settle on "0000" and 'Z' at 0 fs, the initial
          values of v and r
        nvc: >-
          v_dly and r_dly stay "UUUU" and 'U' until 5 ns, as if the
          delayed signals started at the default value of std_logic, as
          in postponed_attrs
        follows: ghdl
        lrm: 16.2.3
        notes: >-
          The implicit signal S'DELAYED(T) takes the initial value of S.
          The trace section compares v_dly and r_dly with the GHDL
          recording only.
        signals:
          - delayed_attrs_tb.r_dly
          - delayed_attrs_tb.v_dly
    trace_sha256: 75c6b6c1b59110729dc5ca68da788f26f427d088c322096bba16bd0162658660
