      exit: 1
      status: problems
      stop_time: 100 ns
      # Diagnostics in sorted (source) order, #20.
      messages:
        - severity: error
          text: a and b high in the same cycle
          time: 55 ns
        - severity: hint
          text: a then b
          time: 35 ns
        - severity: warning
          text: b twice in a row
    features: [psl_assert_cover]
