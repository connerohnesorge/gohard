        process(d) runs 3 times, the postponed process once, seeing only
        the settled '1' (runs counted with the initial run: 2 at 71 ns,
        3 at 81 ns); a postponed concurrent assertion never sees the delta
        glitch of g at 20 ns, which an ordinary process does see. Removing
