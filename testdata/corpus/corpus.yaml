    oracle: both
    hierarchy_oracle: ghdl
    ghdl:
      version: 6.0.0
      command: >-
        ghdl -a --std=08 overload_ops_pkg.vhd overload_ops.vhd
        overload_ops_tb.vhd; ghdl --elab-run --std=08 overload_ops_tb
      result: pass
      exit: 0
      stop_time: 1 ns
      messages:
        - simulation finished @1ns
      notes: every src tag and value matches (S, I, W, N, integer -200)
    nvc:
      version: 1.23.0
      command: >-
        nvc --std=2008 -a overload_ops_pkg.vhd overload_ops.vhd
        overload_ops_tb.vhd -e overload_ops_tb -r
      result: pass
      exit: 0
      stop_time: 1 ns
      messages:
        - '** Note: 1ns+0: FINISH called'
      notes: >-
