  - name: force_ext
    standard: "2008"
    milestone: v1.0
    files:
      - path: force_ext.vhd
        standard: "2008"
      - path: force_ext_tb.vhd
        standard: "2008"
    top: force_ext
    testbench: force_ext_tb
    defines: {}
    models: {}
    expected:
      exit: 0
      status: clean
      stop_time: 9 ns
      messages: []
    features: [process_all, force_release, external_names]
    invariants: [seed_independent, variant_stable, self_stopping]
    oracle: both
    hierarchy_oracle: ghdl
    ghdl:
      version: 6.0.0
      command: >-
        ghdl -a --std=08 force_ext.vhd force_ext_tb.vhd;
        ghdl --elab-run --std=08 force_ext_tb
      result: pass
      exit: 0
      stop_time: 9 ns
      messages:
        - "simulation finished @9ns"
      notes: >-
        Finished via std.env.finish at 9 ns with no assertion output.
        process(all): comb reacts to a, b and op; pick reacts to sel and to
        mid (replacing pick's (all) with (mid) fails the sel check).
        External names: absolute <<signal .force_ext_tb.dut.mid>>,
        upward-relative <<signal ^.dut.mid>> from a process in block chk,
        relative <<signal dut.mid>> from the testbench architecture
        (checked against the expected mid at 1 .. 8 ns; mid has no
        testbench counterpart, so aliasing a and b instead is reported),
        and
        <<constant .force_ext_tb.dut.C_MAGIC>> = 42; all aliases sit in
        process declarative parts after the dut instance so the objects are
        elaborated first. force: mid <= force "0110" (default mode for a
        non-port signal) overrides comb and holds while the inputs change;
        release returns mid to its current driving value without a new
        transaction. Dropping the force or the release is reported.
    nvc:
      version: 1.23.0
      command: >-
        nvc --std=2008 -a force_ext.vhd force_ext_tb.vhd
        -e force_ext_tb -r
      result: pass
      exit: 0
      stop_time: 9 ns
      messages:
        - "** Note: 9ns+0: FINISH called"
      notes: >-
        Same outcome as GHDL. NVC prints a note for FINISH; it is not a
        design message.
    disagreements: []
    trace_sha256: bceac1c4817b55b561c3c1be261fb9c94efc5e1cb248af8aa6342b9cc6d9e7a1
    coverage_sha256: 675e30e50c7c390edfecaa13a82f0ddb5410f166649ad6ac4418a0773945bd78
