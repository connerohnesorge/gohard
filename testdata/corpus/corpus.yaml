    invariants: [seed_independent, variant_stable, self_stopping]
    oracle: both
    hierarchy_oracle: ghdl
    ghdl:
      version: 6.0.0
      command: >-
        ghdl -a --std=08 wait_forms.vhd wait_forms_tb.vhd;
        ghdl --elab-run --std=08 wait_forms_tb
      result: pass
      exit: 0
      stop_time: 500 ns
      messages:
        - "simulation stopped @500ns"
      notes: >-
        Stopped via std.env.stop at 500 ns with no assertion output. Wait
        forms, each asserting the exact time of every resumption: wait;
        wait on a; wait on a, b; wait until c = '1' (an already true
        condition still needs a new event); wait on a until b; wait on c
        for t (timeout, then event); wait until b for t (timeout, then
        condition); wait on a until c for t (condition, then timeout); wait
        for t and wait for 0 ns; wait until true for 3 ns (empty
        sensitivity set, timeout only); a sensitivity list; wait until
        rising_edge(a). Delays on x (pulses of 2, 5 and 20 ns): inertial
        10 ns passes only the 20 ns pulse, transport passes all three,
        reject 3 ns inertial 10 ns passes 5 ns and 20 ns; each output also
        leaves 'U' at 10 ns. Transport preemption deletes the 220 ns
        transaction (events 2 at 215 ns, 3 at 236 ns); inertial preemption
        leaves 2 at 310 ns only, and the marking rule keeps 7 at 406 ns.
        wait for 0 ns is pinned to exactly one delta: a signal assigned
        just before it has its new value and 'event after it, at the same
        now. Mutating the reject limit to 6 ns or the 401 ns value,
        deleting the wait for 0 ns, or doubling it is reported by both
        tools.
    nvc:
      version: 1.23.0
      command: >-
        nvc --std=2008 -a wait_forms.vhd wait_forms_tb.vhd
        -e wait_forms_tb -r
      result: pass
      exit: 0
      stop_time: 500 ns
      messages:
        - "** Note: 500ns+0: STOP called"
      notes: >-
        Same outcome as GHDL. NVC prints a note for STOP; GHDL prints
        "simulation stopped". Neither is a design message, and both exit 0
        for std.env.stop.
    disagreements: []
    trace_sha256: pending
    oracle_sha256: pending
    format_oracle_sha256: 725a3af5b035375a9039c2526f2ce30547bff9db603058a65b073e8070733d66
    semerr_sha256: 8e2581f072eaa3077b5a81168bee1724a408d8debd1a540f0d11a6753b35a8a4

# Parser-regression submodules (#8), sorted by name.
regression:
  #
  # All are git submodules with `shallow = true` in .gitmodules, cloned at
  # depth 1 at the release tag named in each entry comment. Only *.vhd and
  # *.vhdl files are parsed. Nested submodules (VUnit, OSVVM-in-PoC, Open
  # Logic 3rdParty) are not initialised and are not needed: OSVVM is pinned
  # separately under testdata/libs/osvvm.
  #
  # Size on disk (apparent bytes, measured 2026-10-18):
  #   name        worktree   .git/modules   VHDL files  VHDL bytes
  #   ghdl         54.7 MB      12.1 MB        9668*    20.7 MB*
  #   grlib       192.9 MB      33.2 MB        1168     23.4 MB
  #   neorv32       4.7 MB       2.3 MB          68      1.2 MB
  #   nvc          14.3 MB       3.5 MB        2116*     2.9 MB*
  #   open-logic   24.7 MB      16.2 MB         255      3.1 MB
  #   osvvm         3.6 MB       0.4 MB          76      3.5 MB
  #   poc           5.8 MB       1.8 MB         430      3.2 MB
  #   surf         34.7 MB       7.5 MB        1245     14.8 MB
  #   uvvm        110.8 MB      22.6 MB         302      7.9 MB
  #   vunit        10.8 MB       7.4 MB         292      2.2 MB
  #   total       456.9 MB     107.0 MB       15620     83.0 MB
  #   (* counted inside the PR subfolder only: ghdl/testsuite is 25.7 MB,
  #    nvc/test is 5.2 MB; PR checkout total about 31 MB.)
  #   `du -sh` (block usage) of worktrees plus .git/modules is about 620 MB.
  #
  # ---------------------------------------------------------------------------
  # Expected-failure extraction. `expected_failures` lists every upstream
  # file (paths or globs, relative to the submodule) that carries the
  # project's own expectations; the rule for reading each kind is below and
  # must be implemented by the PR parser-regression test:
  #
  # GHDL (testdata/ghdl, subfolder testsuite):
  #   A file is EXPECTED TO FAIL ANALYSIS iff it is named by one of:
  #   1. `analyze_failure` calls in testsuite/<suite>/<dir>/testsuite.sh for
  #      suite in {gna, sanity} (628 call lines in v6.0.0; the helper lives
  #      in testsuite/testenv.sh and runs `ghdl -a --expect-failure`).
  #      Extraction: for each line matching ^\s*analyze_failure\b (ignore
  #      commented lines and `if analyze_failure` re-checks of files already
  #      listed), the file operands are the words that do not start with
  #      `-` and end in .vhd/.vhdl, relative to that script's directory.
  #      Strip trailing redirections (`2> x.err`). Seven scripts loop over
  #      a variable and must be expanded from the loop list in the same
  #      script: gna/bug090 (`for i in *.vhdl`: every .vhdl in the dir),
  #      gna/bug0144 (badloc underscore1 quote1 +.vhdl), gna/issue2686
  #      (tst_rec tst_arr +.vhdl), gna/issue2110 (conf1 psl1 psl2 retid
  #      .vhdl), gna/issue2070, gna/issue2076, gna/issue2116 (the `files="..."`
  #      list above the loop).
  #      Standard: the last `export GHDL_STD_FLAGS=--std=NN` before the call
  #      in that script, an inline `--std=NN` operand, else GHDL's default
  #      93c. Flags such as -frelaxed, --force-analysis, -fpsl, -Werror=...
  #      are recorded but do not change the "may fail" status.
  #   2. VESTS: `run_non_compliant_test <file>` lines in
  #      testsuite/vests/vhdl-93/ashenden/non_compliant/non_compliant.exp
  #      (4 files, --std=93c) and
  #      testsuite/vests/vhdl-93/billowitch/non_compliant/analyzer_failure/
  #      non_compliant.exp (1518 files, --std=93). Files are relative to the
  #      .exp file's directory. NOT expected to fail analysis:
  #      billowitch/non_compliant/simulator_failure/ (run_err mode: analysis
  #      must succeed, only simulation fails).
  #   Every other file analysed by `analyze`, `elab_simulate`, `synth*`,
  #   `build_compliant_test` or `run_compliant_test` must parse. Files that
  #   no script references (and testsuite/vests/vhdl-ams/,
  #   testsuite/vests/vhdl-93/billowitch/disputed/, which testsuite.sh does
  #   not run) have no upstream expectation: parse them, report results,
  #   but do not gate on them.
  #   `synth_failure` / `elab_failure` / `simulate_failure` /
  #   `run_err_non_compliant_test` do NOT mark an analysis failure.
  #
  # NVC (testdata/nvc, subfolder test):
  #   test/regress/testlist.txt (1479 lines, `<name> <opt>,<opt>...`): NO
  #   entry is an analysis failure. run_regr.c runs `nvc -a <name>.vhd -e
  #   <name>` and requires success for every test; the `fail` option
  #   (129 tests) only means the *run* step must fail. So every
  #   test/regress/<name>.vhd listed there must parse, under the standard
  #   from its options (`2000`, `2002`, `2008`, `2019`; default --std=1993,
  #   see push_std in run_regr.c; `relaxed` adds --relaxed; tests flagged
  #   `verilog` have no .vhd and are skipped; `mixed` also has a .v/.sv).
  #   Expected diagnostics live in the C unit tests test/test_*.c (parse,
  #   sem, bounds, simp, elab, lower, psl, ...): within each
  #   START_TEST(...) ... END_TEST block, `input_from_file(TESTDIR
  #   "/<dir>/<file>")` names the input and the preceding
  #   `const error_t expect[] = { { LINE, "snippet" }, ..., { -1, NULL } };
  #   expect_errors(expect);` lists every diagnostic NVC emits on that file,
  #   in order, with its 1-based line and a message substring. Entries with
  #   LINE == 0 are hints attached to the previous diagnostic, not separate
  #   diagnostics. A block with no expect[] (or only {-1, NULL}) and
  #   `fail_if_errors()` means the file is clean. `set_standard(STD_xx)` and
  #   `opt_set_int(OPT_RELAXED, 1)` in the block give the standard and mode
  #   (default 1993 for unit tests). Five blocks read more than one file;
  #   the expect[] in force at each input_from_file applies to it. These
  #   diagnostics include warnings and semantic errors, so for the parser
  #   gate a listed file is "may fail"; line numbers feed the sema oracle.
  #
  # All other entries: the projects keep no expected-failure list; every
  # VHDL file is expected to parse (`expected_failures: []`). Semantic
  # checks need the project's own compile order (open-logic compile_order.txt, OSVVM
  # osvvm.pro, PoC PoC.pro, UVVM <lib>/script/compile_order.txt,
  # VUnit vunit/vhdl/*, NEORV32 rtl/file_list_*.f, SURF ruckus.tcl,
  # GRLIB lib/libs.txt + per-library dirs.txt/vhdlsyn.txt).
  # ---------------------------------------------------------------------------

  # GHDL v6.0.0 (matches the oracle GHDL 6.0.0). Licence file COPYING.md
  # (GPL-2.0, source headers "version 2 ... or any later"). VESTS is
  # testsuite/vests/LICENSE + COPYING: GPL-2.0 (University of Cincinnati).
  - name: ghdl
    path: testdata/ghdl
    url: https://github.com/ghdl/ghdl.git
    commit: e589c698c351369ac5bcfe7abe1f1152ac5d4727
    license: GPL-2.0-or-later
    tag: pr
    subfolder: testsuite
    semerr_sha256: f90a95fd9b19664ed3242f19aa25de36ab1d2a16a5161347067565eea1dea696
    expected_failures:
      - testsuite/gna/*/testsuite.sh
      - testsuite/sanity/*/testsuite.sh
      - testsuite/vests/vhdl-93/ashenden/non_compliant/non_compliant.exp
      - >-
        testsuite/vests/vhdl-93/billowitch/non_compliant/analyzer_failure/non_compliant.exp
  # GRLIB GPL grlib-gpl-2026.2-b4300. Frontgrade Gaisler publishes GRLIB
