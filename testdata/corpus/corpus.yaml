        notes: "the value is globally static, so GoHard evaluates it before anything runs (#34) and reports the error that GHDL and NVC report only at elaboration or simulation (their test scripts expect that failure)"
      - path: gna/issue2116/func4_0.vhdl
        line: 5
        gohard: error
        lrm: "9.4.3, 9.2.8"
        notes: "the value is globally static, so GoHard evaluates it before anything runs (#34) and reports the error that GHDL and NVC report only at elaboration or simulation (their test scripts expect that failure)"
      - path: gna/issue2960/e.vhdl
        line: 19
        gohard: error
        lrm: "9.4.3, 5.2.3.1"
        notes: "the value is globally static, so GoHard evaluates it before anything runs (#34) and reports the error that GHDL and NVC report only at elaboration or simulation (their test scripts expect that failure)"
      - path: gna/issue333/repro.vhdl
        line: 9
        gohard: error
        lrm: "9.4.3, 5.2.3.1"
        notes: "the value is globally static, so GoHard evaluates it before anything runs (#34) and reports the error that GHDL and NVC report only at elaboration or simulation (their test scripts expect that failure)"
      - path: gna/issue333/repro.vhdl
        line: 11
        gohard: error
        lrm: "9.4.3, 5.2.3.1"
        notes: "the value is globally static, so GoHard evaluates it before anything runs (#34) and reports the error that GHDL and NVC report only at elaboration or simulation (their test scripts expect that failure)"
      - path: gna/issue333/time_test.vhdl
