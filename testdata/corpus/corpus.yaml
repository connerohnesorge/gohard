        allocations, none deallocated). The only stdout line from the
        design is the writeline(output) line "gc_heap: queue and lists
        ok"; it is textio output, not a diagnostic.
    nvc:
      version: 1.23.0
      command: >-
        nvc --std=2019 -a gc_heap.vhd gc_heap_tb.vhd -e gc_heap_tb -r
      result: pass
      exit: 0
      stop_time: 2020 ns
      messages:
        - "gc_heap: queue and lists ok"
        - "** Note: 2020ns+1: FINISH called"
      notes: >-
        Same writeline(output) line as GHDL. Garbage collection is not
        visible in VHDL: the design passes with the same trace whether or
        not the dropped nodes are reclaimed. GoHard's collector (#27)
        keeps the live heap bounded (internal/elab TestGCHeapCorpus);
        the trace is identical with the collector off, forced on every
        allocation and at its default period.
    disagreements:
      - topic: INTEGER range under VHDL-2019 (trace oracle)
        ghdl: >-
          INTEGER stays 32 bits under --std=19: dout starts at
          -2147483648 and the integer signals dump 32 bits wide
        nvc: >-
          INTEGER is 64 bits under --std=2019: dout starts at
          -9223372036854775808
        follows: nvc
        lrm: 5.2.3.2
        notes: >-
          VHDL-2019 requires INTEGER to cover at least 64-bit two's
          complement (#18, Stage 1); GoHard's dout starts at
          integer'left = -9223372036854775808, as NVC's. The trace
          section compares dout with the NVC recording only.
        signals:
          - gc_heap_tb.dout
          - gc_heap_tb.dut.dout
      - topic: last clock edge at the std.env.finish time (trace oracle)
        ghdl: >-
          the VCD ends before the falling clk edge at 2020 ns, the time
          step in which std.env.finish is called (in its next delta)
        nvc: >-
          dumps clk settling on '0' at 2020 ns, then FINISH is called at
          2020ns+1
        follows: ghdl
        lrm: 14.7.5
        notes: >-
          The clk assignment matures in delta 0 of 2020 ns, before the
          delta in which lists calls finish, so GoHard's own trace
          (golden/trace.txt) has the change, as NVC's dump does. The
          trace section leaves the final time step of a run the design
          stops out of GoHard's projection (CompareOracleStopped: the
          tools normally do not dump it), as GHDL does, so it compares
          clk with the GHDL recording only.
        signals:
          - gc_heap_tb.clk
          - gc_heap_tb.dut.clk
