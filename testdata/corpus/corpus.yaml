    standard: "2008"
    milestone: v1.1
    files:
      - path: ext_vars_pkg.vhd
        standard: "2008"
      - path: ext_vars.vhd
        standard: "2008"
      - path: ext_vars_tb.vhd
        standard: "2008"
    top: ext_vars
    testbench: ext_vars_tb
    defines: {}
    models: {}
    expected:
      exit: 0
      status: clean
      stop_time: 7 ns
      messages: []
    features: [external_variable, external_package_path]
    invariants: [seed_independent, variant_stable, self_stopping]
    oracle: ghdl
    hierarchy_oracle: ghdl
    ghdl:
      version: 6.0.0
      command: >-
        ghdl -a --std=08 ext_vars_pkg.vhd ext_vars.vhd ext_vars_tb.vhd;
        ghdl --elab-run --std=08 ext_vars_tb
      result: pass
      exit: 0
      stop_time: 7 ns
      messages:
        - "simulation finished @7ns"
      notes: >-
        Finished via std.env.finish at 7 ns with no assertion output.
        External names: the variable <<variable .ext_vars_tb.dut.hits :
        counter_t>> (a shared variable of the dut architecture), and
        through package paths <<variable @work.ext_vars_obj.total :
        counter_t>> and <<constant @work.ext_vars_obj.C_STEP : integer>>.
        The testbench reads both counters with get and changes them with
        add; total is then read under its own name (use clause) and
        holds the change. GHDL needs the use clause of ext_vars_obj in
        the testbench: without it the package is not elaborated and the
        package path is "cannot find package". Changing hits.add(10) to
        add(9) is reported at 7 ns ("external variable after add") by
        GHDL and GoHard.
    nvc:
      version: 1.23.0
      command: >-
        nvc --std=2008 -a ext_vars_pkg.vhd ext_vars.vhd ext_vars_tb.vhd
        -e ext_vars_tb -r
      result: analysis-error
      exit: 1
      stop_time: none
      messages:
        - "** Error: protected type COUNTER_T has no method named GET"
        - "** Error: protected type COUNTER_T has no method named ADD"
      notes: >-
        NVC 1.23.0 rejects every method call through an external
        variable name or its alias (ext_vars_tb.vhd lines 34, 35, 39,
        40 and 43), although counter_t declares get and add; a call
        through the package's own name (total.get) is accepted. So NVC
        is not an oracle for this design. It runs the package-path
        constant alone.
    disagreements:
      - topic: method calls through an external variable name
        ghdl: accepts and runs them on the denoted shared variable
        nvc: >-
          rejects them at analysis ("protected type COUNTER_T has no
          method named GET")
        follows: ghdl
        lrm: "8.7"
        notes: >-
          An external variable name denotes the shared variable itself,
          so its protected type's methods apply (LRM 8.7, 5.6.2). The
          trace oracle is GHDL alone.
    trace_sha256: bc2d88a8aa2f0566d055d65a8ac576759987f60a607d718a3ec9d0af4b8b68e0
    oracle_sha256: 21b4a055e78e9108633c53b7630cb73e2b0e410bd672deabe994b0209f3a8c41
