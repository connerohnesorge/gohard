    # The same outcome at every seed; only the trace (the value of
    # order) depends on the seed. `gohard check --sim --seed N` with
    # N >= 1 adds one sim/race warning naming two of the writers; the
    # harness checks that through races_by_design, not here.
    expected:
      exit: 0
      status: clean
      stop_time: 20 ns
      messages: []
    features: [race_warning]
    invariants: [races_by_design, variant_stable, self_stopping]
    oracle: both
    hierarchy_oracle: ghdl
    ghdl:
      version: 6.0.0
      command: >-
        ghdl -a --std=08 race_order.vhd race_order_tb.vhd;
        ghdl --elab-run --std=08 race_order_tb
      result: pass
      exit: 0
      stop_time: 20 ns
      messages:
        - "simulation finished @20ns"
      notes: >-
        GHDL runs the eight writers in reverse order: order is 87654321
        from 15 ns. The check (a permutation of 1 .. 8) passes; finished
        via std.env.finish at 20 ns.
    nvc:
      version: 1.23.0
      command: >-
        nvc --std=2008 -a race_order.vhd race_order_tb.vhd -e race_order_tb
        -r
      result: pass
      exit: 0
      stop_time: 20 ns
      messages:
        - "** Note: 20ns+0: FINISH called"
      notes: >-
        NVC runs the writers in declaration order: order is 12345678
        from 15 ns, as in GoHard at seed 0.
    disagreements:
      - topic: in-delta order of the eight writers (the race)
        ghdl: runs writers(8) first, order = 87654321
        nvc: runs writers(1) first, order = 12345678
        follows: nvc
        lrm: 14.7.5.3
        notes: >-
          The LRM does not define the order in which the processes of
          one simulation cycle run, so both values are correct. GoHard
          runs them in declaration order at seed 0, as NVC does, and in
          a seed-dependent order at the other seeds (sim/race). The
          trace section compares order with the NVC recording only.
        signals:
          - race_order_tb.dut.order
